<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time outbreak detection and response for mass gatherings. Capture, detect, dispatch — in minutes, not days." />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <title>Siddhi — outbreak early warning</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Emergency escape hatch, inline and BEFORE the bundle.
         This used to live in main.jsx — which is itself a file the service
         worker serves, so in the one emergency it exists for (the caches are
         what's broken, the bundle never executes) it could not run. It also
         has to reload: unregister() does not stop the already-controlling
         worker from serving the current page. -->
    <script>
      if (location.search.indexOf('nosw') > -1 && 'serviceWorker' in navigator) {
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister() }))
          }),
          self.caches ? caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k) }))
          }) : null,
        ]).then(function () { location.replace(location.pathname) })
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
